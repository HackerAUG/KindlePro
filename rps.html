<script>
function play(c){
  var ch=['rock','paper','scissors'], comp=ch[Math.floor(Math.random()*3)];
  var win={rock:'scissors',paper:'rock',scissors:'paper'};
  var r = win[c]===comp ? 'You win!' : (c===comp ? 'Draw!' : 'You lose!');
  document.getElementById('msg').innerHTML = 'You: '+c+' vs Computer: '+comp+' - <b>'+r+'</b>';
}
</script>
