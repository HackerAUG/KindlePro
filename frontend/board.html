<html><head><meta charset="utf-8"><title>Board - KindlePro</title><link rel="stylesheet" href="style.css"></head>
<body><div id="wrap">
<div id="side"><h2>KindlePro</h2><a href="index.html">Home</a><a href="chat.html">Chat</a><a href="topics.html">Topics</a><a href="board.html">Board</a><a href="games.html">Games</a><a href="tools.html">Tools</a><hr><div id="userbox"></div></div><div id="main">
<h1>Board</h1>
<div id="list">Loading...</div>
<hr><h2>New Thread</h2>
Title:<br><input id="title"><br>Body:<br><textarea id="body" rows="4"></textarea><br>
<button onclick="make()">Post Thread</button>
</div>
<script src="config.js"></script><script src="api.js"></script>
<script>
function load(){ api('/api/threads', null, function(rows){
  var h=''; (rows||[]).forEach(function(r){ h += '<div class="msg"><a href="thread.html?id='+r.id+'"><b>'+esc(r.title)+'</b></a> <span class="small">by '+esc(r.author)+', '+r.replies+' replies</span></div>'; });
  document.getElementById('list').innerHTML = h || '<p>No threads yet.</p>';
});}
function make(){
  var t=document.getElementById('title').value; if(!t) return;
  api('/api/threads', {title:t, body:document.getElementById('body').value}, function(){ load(); });
}
load();
</script>
</div><script src="site.js"></script></body></html>
