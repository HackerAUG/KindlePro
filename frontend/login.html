<html><head><meta charset="utf-8"><title>Login - KindlePro</title><link rel="stylesheet" href="style.css"></head>
<body><div id="wrap"><div id="side"><h2>KindlePro</h2><a href="index.html">Home</a><a href="chat.html">Chat</a><a href="topics.html">Topics</a><a href="board.html">Board</a><a href="games.html">Games</a><a href="tools.html">Tools</a><hr><div id="userbox"></div></div><div id="main">
<h1>Login</h1>
<p id="err"></p>
Username:<br><input id="u"><br>Password:<br><input id="p" type="password"><br>
<button onclick="login()">Login</button> <a href="register.html">Register</a>
</div></div>
<script src="config.js"></script><script src="api.js"></script><script src="site.js"></script>
<script>
function login(){
  api('/api/login', {username: document.getElementById('u').value, password: document.getElementById('p').value}, function(r){
    if (r && r.token) { setToken(r.token); location.href = 'chat.html'; }
    else document.getElementById('err').innerHTML = '<b>Bad login.</b>';
  });
}
</script>
</body></html>
