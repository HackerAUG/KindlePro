<html><head><meta charset="utf-8"><title>Tools - KindlePro</title><link rel="stylesheet" href="style.css"></head>
<body><div id="wrap">
<div id="side"><h2>KindlePro</h2><a href="index.html">Home</a><a href="chat.html">Chat</a><a href="topics.html">Topics</a><a href="board.html">Board</a><a href="games.html">Games</a><a href="tools.html">Tools</a><hr><div id="userbox"></div></div><div id="main">
<h1>Tools</h1>
<h2>Calculator</h2>
<input id="a" placeholder="num" style="width:25%"> <select id="op" style="width:60px"><option>+</option><option>-</option><option>*</option><option>/</option></select> <input id="b" placeholder="num" style="width:25%"> <button onclick="calc()">=</button>
<p id="r1"></p>
<h2>Reading Time</h2>
Word count:<br><input id="w"> <button onclick="rt()">Estimate</button>
<p id="r2"></p>
<h2>Convert</h2>
<input id="v" style="width:25%"> <select id="t"><option value="km_mi">km to mi</option><option value="mi_km">mi to km</option><option value="kg_lb">kg to lb</option><option value="lb_kg">lb to kg</option><option value="c_f">C to F</option><option value="f_c">F to C</option></select> <button onclick="conv()">Go</button>
<p id="r3"></p>
<script>
function calc(){ var x=parseFloat(document.getElementById('a').value), y=parseFloat(document.getElementById('b').value), o=document.getElementById('op').value, r;
  if(o==='+')r=x+y; if(o==='-')r=x-y; if(o==='*')r=x*y; if(o==='/')r=y?x/y:'err';
  document.getElementById('r1').innerHTML='<b>'+r+'</b>'; }
function rt(){ var w=parseInt(document.getElementById('w').value,10); document.getElementById('r2').innerHTML = isNaN(w)?'Enter a number':'<b>About '+Math.max(1,Math.round(w/200))+' minutes</b> (200 wpm)'; }
function conv(){ var v=parseFloat(document.getElementById('v').value), t=document.getElementById('t').value, r;
  if(t==='km_mi')r=v*0.6214; if(t==='mi_km')r=v*1.609; if(t==='kg_lb')r=v*2.205; if(t==='lb_kg')r=v*0.4536; if(t==='c_f')r=v*9/5+32; if(t==='f_c')r=(v-32)*5/9;
  document.getElementById('r3').innerHTML='<b>'+r+'</b>'; }
</script>
</div></div><script src="config.js"></script><script src="api.js"></script><script src="site.js"></script></body></html>
