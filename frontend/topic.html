<html><head><meta charset="utf-8"><meta http-equiv="refresh" content="15"><title>Topic - KindlePro</title><link rel="stylesheet" href="style.css"></head>
<body><div id="wrap">
<div id="side"><h2>KindlePro</h2><a href="index.html">Home</a><a href="chat.html">Chat</a><a href="topics.html">Topics</a><a href="board.html">Board</a><a href="games.html">Games</a><a href="tools.html">Tools</a><hr><div id="userbox"></div></div><div id="main">
<h1 id="title">Topic</h1>
<p class="small" id="desc"></p>
<div id="msgs">Loading...</div>
<hr>
Message:<br><textarea id="msg" rows="3"></textarea><br>
<button onclick="send()">Post</button> <a href="topics.html">Back</a>
</div>
<script src="config.js"></script><script src="api.js"></script>
<script>
var id = qs('id');
api('/api/topics/'+id, null, function(t){ if(t){ document.getElementById('title').innerHTML=esc(t.name); document.getElementById('desc').innerHTML=esc(t.description); } });
api('/api/topics/'+id+'/messages', null, function(rows){
  var h=''; (rows||[]).forEach(function(r){ h += '<div class="msg"><b>'+esc(r.name)+'</b>: '+esc(r.msg)+'</div>'; });
  document.getElementById('msgs').innerHTML = h || '<p>No messages yet.</p>';
});
function send(){
  var m=document.getElementById('msg').value; if(!m) return;
  api('/api/topics/'+id+'/messages', {msg:m}, function(){ location.reload(); });
}
</script>
</div><script src="site.js"></script></body></html>
